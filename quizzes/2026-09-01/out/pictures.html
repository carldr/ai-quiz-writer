<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Pub Quiz — 2026-09-01 — Pictures</title>
<style>/* Shared by all three sheets, and inlined ahead of the sheet's own stylesheet.
   Everything here is used by every sheet; anything used by only one belongs in
   that sheet's file.

   Five type sizes, each with one job: 24pt sheet title, 16pt round title, 11pt
   body, 10pt instructions, 9pt small labels. The 9pt is set where it is used. */

@page {
  size: A4;
  margin: 20mm;
}

body {
  font-family: -apple-system, 'SF Pro Text', Helvetica, Arial, sans-serif;
  font-size: 11pt;
  line-height: 1.5;
  margin: 0;
}

/* The title line: what the sheet is on the left, the total on the right. */
.sheet-header {
  font-size: 24pt;
  font-weight: 700;
  margin: 0 0 9mm;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
}

/* The round title, with its score box on the right. No space above it by
   default, which is what the team sheet wants because every round there starts
   a new page. The two sheets whose rounds run on set their own top margin. */
.round-header {
  font-size: 16pt;
  font-weight: 700;
  margin: 0 0 2mm;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
}

.instructions {
  font-size: 10pt;
  margin: 0 0 5mm;
}
/* Picture sheet. The numbered grid teams look at, with no answers and no sheet
   title. A 15-image round fits one A4 page. Loaded after common.css. */

/* A quiz with two picture rounds prints them one after another, so every round
   title but the first needs space above it. */
.round-header {
  margin-top: 9mm;
  break-after: avoid;
  page-break-after: avoid;
}
.round-header:first-child {
  margin-top: 0;
}

/* The grid is capped at 152mm wide so five rows clear the page depth. Every
   cell is 4:3; an image of another shape is cropped equally at both overflowing
   edges. */
.picture-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1.5mm 3mm;
  max-width: 152mm;
}
.picture-grid figure {
  margin: 0;
  text-align: center;
}
.picture-grid img {
  width: 100%;
  aspect-ratio: 4 / 3;
  height: auto;
  object-fit: cover;
  border: 1px solid #333;
}
.picture-grid figcaption {
  font-size: 9pt;
  line-height: 1.1;
}
</style></head>
<body><h2 class="round-header"><span>Round 1 - Teacher, Teacher</span><span>__ / 15</span></h2><p class="instructions">Name the show or film each teacher is from. One point each. Character names score nothing.</p><div class="picture-grid"><figure><img src="../images/r1-01.jpg"><figcaption>1</figcaption></figure><figure><img src="../images/r1-02.jpg"><figcaption>2</figcaption></figure><figure><img src="../images/r1-03.jpg"><figcaption>3</figcaption></figure><figure><img src="../images/r1-04.png"><figcaption>4</figcaption></figure><figure><img src="../images/r1-05.jpg"><figcaption>5</figcaption></figure><figure><img src="../images/r1-06.jpg"><figcaption>6</figcaption></figure><figure><img src="../images/r1-07.jpg"><figcaption>7</figcaption></figure><figure><img src="../images/r1-08.jpg"><figcaption>8</figcaption></figure><figure><img src="../images/r1-09.jpg"><figcaption>9</figcaption></figure><figure><img src="../images/r1-10.jpg"><figcaption>10</figcaption></figure><figure><img src="../images/r1-11.png"><figcaption>11</figcaption></figure><figure><img src="../images/r1-12.jpg"><figcaption>12</figcaption></figure><figure><img src="../images/r1-13.png"><figcaption>13</figcaption></figure><figure><img src="../images/r1-14.jpg"><figcaption>14</figcaption></figure><figure><img src="../images/r1-15.jpg"><figcaption>15</figcaption></figure></div></body></html>
