<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Pub Quiz — 2026-09-01 — Pictures</title>
<style>/* Shared, and inlined ahead of the sheet's own stylesheet. Anything used by more
   than one sheet belongs here; anything used by only one belongs in that
   sheet's file.

   Five type sizes, each with one job: 24pt sheet title, 16pt round title, 11pt
   body, 10pt instructions, 9pt small labels. The 9pt is set where it is used. */

@page {
  size: A4;
  margin: 20mm;
}

body {
  font-family: -apple-system, 'SF Pro Text', Helvetica, Arial, sans-serif;
  font-size: 11pt;
  line-height: 1.5;
  margin: 0;
}

/* The title line: what the sheet is on the left, the total on the right. */
.sheet-header {
  font-size: 24pt;
  font-weight: 700;
  margin: 0 0 9mm;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
}

/* The round title, with its score box on the right. It carries space above it
   for the two sheets whose rounds run on down the page; the team sheet takes
   that space back, because every round there starts a new page. A round title
   never sits at the foot of a page with its questions overleaf. */
.round-header {
  font-size: 16pt;
  font-weight: 700;
  margin: 9mm 0 2mm;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  break-after: avoid;
  page-break-after: avoid;
}

.instructions {
  font-size: 10pt;
  margin: 0 0 5mm;
}

/* A picture round is laid out the same way on all three sheets: three cells
   across the page, every cell 4:3, and the numbers in the same places. The
   picture sheet and the answer sheet fill a cell with the image; the team sheet
   leaves it empty to write in. */
.picture-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
}
.picture {
  margin: 0;
}
.picture img {
  width: 100%;
  aspect-ratio: 4 / 3;
  height: auto;
  object-fit: cover;
  display: block;
  border: 1px solid #333;
}

/* Both numbered lists count with a CSS counter rather than the browser's own
   numbering, so the number sits in a fixed-width column. */
.question-list,
.answer-lines {
  list-style: none;
  counter-reset: question;
  padding: 0;
}
.question-list > li,
.answer-lines li {
  counter-increment: question;
}
.question-list > li::before,
.answer-lines li::before {
  content: counter(question) '.';
  text-align: right;
}
/* Picture sheet. The numbered grid teams look at, with no answers and no sheet
   title. A 15-image round fits one A4 page. Loaded after common.css. */

/* A quiz with two picture rounds prints them one after another, so every round
   title but the first keeps the space common.css puts above it. */
.round-header:first-child {
  margin-top: 0;
}

/* Capped at 152mm wide so five rows clear the page depth. */
.picture-grid {
  gap: 1.5mm 3mm;
  max-width: 152mm;
}
.picture {
  text-align: center;
}
.picture figcaption {
  font-size: 9pt;
  line-height: 1.1;
}
</style></head>
<body><h2 class="round-header"><span>Round 1 - Teacher, Teacher</span><span>__ / 15</span></h2><p class="instructions">Name the show or film each teacher is from. One point each. Character names score nothing.</p><div class="picture-grid"><figure class="picture"><img src="../images/r1-01.jpg"><figcaption>1</figcaption></figure><figure class="picture"><img src="../images/r1-02.jpg"><figcaption>2</figcaption></figure><figure class="picture"><img src="../images/r1-03.jpg"><figcaption>3</figcaption></figure><figure class="picture"><img src="../images/r1-04.png"><figcaption>4</figcaption></figure><figure class="picture"><img src="../images/r1-05.jpg"><figcaption>5</figcaption></figure><figure class="picture"><img src="../images/r1-06.jpg"><figcaption>6</figcaption></figure><figure class="picture"><img src="../images/r1-07.jpg"><figcaption>7</figcaption></figure><figure class="picture"><img src="../images/r1-08.jpg"><figcaption>8</figcaption></figure><figure class="picture"><img src="../images/r1-09.jpg"><figcaption>9</figcaption></figure><figure class="picture"><img src="../images/r1-10.jpg"><figcaption>10</figcaption></figure><figure class="picture"><img src="../images/r1-11.png"><figcaption>11</figcaption></figure><figure class="picture"><img src="../images/r1-12.jpg"><figcaption>12</figcaption></figure><figure class="picture"><img src="../images/r1-13.png"><figcaption>13</figcaption></figure><figure class="picture"><img src="../images/r1-14.jpg"><figcaption>14</figcaption></figure><figure class="picture"><img src="../images/r1-15.jpg"><figcaption>15</figcaption></figure></div></body></html>
